<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="lnoteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3370FF"/>
      <stop offset="1" stop-color="#2860E1"/>
    </linearGradient>
  </defs>

  <!-- 圆角矩形底板：品牌蓝对角渐变（与页面按钮 #3370FF 保持一致） -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#lnoteGrad)"/>

  <!-- L 笔画（白色，圆角粗笔触） -->
  <g fill="#FFFFFF">
    <!-- 竖笔 -->
    <rect x="300" y="290" width="150" height="470" rx="62" ry="62"/>
    <!-- 横笔 -->
    <rect x="300" y="620" width="430" height="140" rx="62" ry="62"/>
  </g>

  <!-- 墨点（右上，白色实心圆，呼应 L 笔触收尾） -->
  <circle cx="742" cy="298" r="74" fill="#FFFFFF"/>
</svg>
