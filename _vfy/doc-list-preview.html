<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>L.Note · 我的文档 macOS 备忘录风格预览</title>
<style>
  :root {
    --bg: #ffffff;
    --sidebar-bg: #F5F6F7;
    --text: #1F2329;
    --text-secondary: rgba(31, 35, 41, 0.66);
    --text-faint: rgba(31, 35, 41, 0.42);
    --border: #e4e6e8;
    --hover: rgba(0, 0, 0, 0.045);
    --active: #D3DEF6;
    --active-text: #1F2329;
    --accent: #3E9BDC;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-ui); background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

  /* ===== 侧边栏（macOS 备忘录风格） ===== */
  #sidebar {
    width: 250px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 12px 8px;
  }
  .workspace-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
  }
  .workspace-icon { font-size: 16px; }

  .sidebar-actions {
    padding: 4px 8px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-bottom: 1px solid var(--border);
  }
  .side-action {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 6px 8px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font-ui);
    transition: background 0.12s;
  }
  .side-action:hover { background: rgba(0,0,0,0.05); color: var(--text); }

  .side-tabs { display: flex; gap: 4px; padding: 8px 10px 4px; border-bottom: 1px solid var(--border); }
  .side-tab {
    flex: 1;
    border: none;
    background: transparent;
    padding: 5px 0;
    border-radius: 10px;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font-ui);
  }
  .side-tab:hover { background: var(--hover); }
  .side-tab.active { background: var(--active); color: var(--active-text); font-weight: 600; }

  .sidebar-section-label {
    padding: 14px 18px 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  #doc-list { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
  .doc-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 9px;
    margin: 1px 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: background 0.12s;
    user-select: none;
  }
  .doc-item:hover { background: rgba(0, 0, 0, 0.05); }
  .doc-item.active { background: var(--active); color: var(--active-text); font-weight: 500; }
  .doc-item .doc-emoji { flex-shrink: 0; width: 20px; font-size: 14px; text-align: center; }
  .doc-item .doc-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-item .doc-time { font-size: 11px; color: var(--text-faint); flex-shrink: 0; }
  .doc-item.active .doc-time { color: rgba(31, 35, 41, 0.6); }
  .doc-item .doc-del {
    flex-shrink: 0; width: 22px; height: 22px; border: none; background: transparent;
    color: var(--text-faint); font-size: 14px; border-radius: 4px; cursor: pointer;
    display: none; align-items: center; justify-content: center; padding: 0; line-height: 1;
  }
  .doc-item:hover .doc-del { display: inline-flex; }
  .doc-item.active .doc-del { display: inline-flex; color: rgba(31, 35, 41, 0.55); }
  .doc-item .doc-del:hover { background: rgba(220, 53, 69, 0.12); color: #d63b3b; }

  .sidebar-footer {
    padding: 8px 12px;
    font-size: 10.5px;
    color: var(--text-faint);
    border-top: 1px solid var(--border);
    text-align: center;
  }

  /* ===== 主区域 ===== */
  #main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .tool-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 10px;
    padding: 5px 10px;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font-ui);
  }
  .tool-btn:hover { background: rgba(0,0,0,0.05); }
  .editor-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-size: 15px;
  }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="workspace-badge"><span class="workspace-icon">🖋️</span><span>L.Note 工作台</span></div>
      <button class="side-action" style="width:auto;padding:4px 8px;">«</button>
    </div>
    <div class="sidebar-actions">
      <button class="side-action">＋ 新建文档</button>
      <button class="side-action">📄 新建富文档</button>
      <button class="side-action">🔀 新建流程图</button>
      <button class="side-action">🧠 新建思维导图</button>
      <button class="side-action">📋 新建思维笔记</button>
    </div>
    <div class="side-tabs">
      <button class="side-tab active">📚 文档</button>
      <button class="side-tab">📁 文件</button>
    </div>
    <div class="sidebar-section-label">我的文档</div>
    <div id="doc-list">
      <div class="doc-item"><span class="doc-emoji">📝</span><span class="doc-name">跨境寄售工单分析 2026-08</span><span class="doc-time">5分钟前</span><button class="doc-del">🗑</button></div>
      <div class="doc-item active"><span class="doc-emoji">📋</span><span class="doc-name">Ozon 库存快照 SKU-3632688126</span><span class="doc-time">1小时前</span><button class="doc-del">🗑</button></div>
      <div class="doc-item"><span class="doc-emoji">📝</span><span class="doc-name">Wildberries FBW API 调研笔记</span><span class="doc-time">昨天</span><button class="doc-del">🗑</button></div>
      <div class="doc-item"><span class="doc-emoji">🧠</span><span class="doc-name">BoardFlow 便利贴光标定位方案</span><span class="doc-time">昨天</span><button class="doc-del">🗑</button></div>
      <div class="doc-item"><span class="doc-emoji">📊</span><span class="doc-name">寄售结算单 6 月数据</span><span class="doc-time">2天前</span><button class="doc-del">🗑</button></div>
      <div class="doc-item"><span class="doc-emoji">📝</span><span class="doc-name">Amazon FBA 补货计划 v3</span><span class="doc-time">3天前</span><button class="doc-del">🗑</button></div>
      <div class="doc-item"><span class="doc-emoji">🔀</span><span class="doc-name">wms-cross 审核流程图</span><span class="doc-time">4天前</span><button class="doc-del">🗑</button></div>
      <div class="doc-item"><span class="doc-emoji">📝</span><span class="doc-name">2026-08-11 工作日志</span><span class="doc-time">6天前</span><button class="doc-del">🗑</button></div>
    </div>
    <div class="sidebar-footer">L.Note v0.20.29 · macOS 备忘录风格 · 我的文档</div>
  </aside>
  <div id="main">
    <div id="toolbar">
      <div style="flex:1;font-size:13px;color:var(--text-secondary);">📝 Ozon 库存快照 SKU-3632688126</div>
      <button class="tool-btn">🔍 查找</button>
      <button class="tool-btn">🔣 编码</button>
      <button class="tool-btn">🛠 JSON工具</button>
    </div>
    <div class="editor-placeholder">← 侧边栏「我的文档」已重设计为 macOS 备忘录风格</div>
  </div>
</body>
</html>
