<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L.Note 图片查看器</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    background: #1e1e22; color: #e8e8ea;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  .iv-top {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: #2a2a30;
    border-bottom: 1px solid #38383f; flex: none;
  }
  .iv-title { font-size: 13px; font-weight: 600; color: #cfcfd4; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .iv-zoom-label { font-size: 12px; color: #9a9aa2; min-width: 52px; text-align: center; }
  .iv-btn {
    border: 1px solid #44444c; background: #35353d; color: #e8e8ea;
    border-radius: 6px; padding: 5px 11px; font-size: 13px; cursor: pointer;
    font-family: inherit; line-height: 1; user-select: none;
  }
  .iv-btn:hover { background: #41414a; }
  .iv-btn:active { background: #2f2f37; }
  .iv-btn.icon { min-width: 34px; padding: 5px 0; text-align: center; }
  .iv-sep { width: 1px; height: 20px; background: #44444c; margin: 0 2px; }

  .iv-stage {
    flex: 1; position: relative; overflow: hidden;
    cursor: grab; background:
      repeating-conic-gradient(#26262b 0% 25%, #202024 0% 50%) 50% / 24px 24px;
    touch-action: none;
  }
  .iv-stage.grabbing { cursor: grabbing; }
  .iv-stage .iv-img-wrap {
    position: absolute; left: 50%; top: 50%;
    transform-origin: center center;
    will-change: transform;
  }
  .iv-stage img {
    display: block; max-width: none; user-select: none; -webkit-user-drag: none;
    box-shadow: 0 6px 30px rgba(0,0,0,0.5);
  }
  .iv-hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #d6d6da; font-size: 12px;
    padding: 5px 12px; border-radius: 20px; pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .iv-hint.show { opacity: 1; }
  .iv-loading {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #9a9aa2; font-size: 14px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="iv-top">
    <span class="iv-title" id="iv-title">图片查看器</span>
    <span class="iv-sep"></span>
    <button class="iv-btn icon" id="iv-zoom-out" title="缩小 (Ctrl+-)">－</button>
    <span class="iv-zoom-label" id="iv-zoom">100%</span>
    <button class="iv-btn icon" id="iv-zoom-in" title="放大 (Ctrl++)">＋</button>
    <span class="iv-sep"></span>
    <button class="iv-btn" id="iv-actual" title="实际大小 (1:1)">实际大小</button>
    <button class="iv-btn" id="iv-fit" title="适应窗口">适应</button>
    <button class="iv-btn" id="iv-reset" title="重置 (0)">重置</button>
    <span class="iv-sep"></span>
    <button class="iv-btn" id="iv-close" title="关闭 (Esc)">关闭</button>
  </div>
  <div class="iv-stage" id="iv-stage">
    <div class="iv-img-wrap" id="iv-wrap">
      <img id="iv-img" alt="图片">
    </div>
    <div class="iv-loading" id="iv-loading">加载中…</div>
    <div class="iv-hint" id="iv-hint"></div>
  </div>
</div>

<script>
  var data = { src: "", name: "图片" };
  var img = document.getElementById('iv-img');
  var wrap = document.getElementById('iv-wrap');
  var stage = document.getElementById('iv-stage');
  var zoomLabel = document.getElementById('iv-zoom');
  var loading = document.getElementById('iv-loading');
  var hintEl = document.getElementById('iv-hint');

  var scale = 1, tx = 0, ty = 0;
  var minScale = 0.1, maxScale = 8;

  function showHint(msg) {
    hintEl.textContent = msg;
    hintEl.classList.add('show');
    clearTimeout(showHint._t);
    showHint._t = setTimeout(function () { hintEl.classList.remove('show'); }, 1100);
  }

  function apply() {
    wrap.style.transform = 'translate(-50%, -50%) translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    zoomLabel.textContent = Math.round(scale * 100) + '%';
  }

  function clampScale(s) { return Math.max(minScale, Math.min(maxScale, s)); }

  function setScale(ns, cx, cy) {
    // 以 (cx,cy) 为锚点缩放（视口坐标）
    ns = clampScale(ns);
    var rect = stage.getBoundingClientRect();
    var px = (cx != null ? cx : rect.width / 2) - rect.left;
    var py = (cy != null ? cy : rect.height / 2) - rect.top;
    // 锚点相对 wrap 中心：变换前
    var ocx = (px - rect.width / 2 - tx);
    var ocy = (py - rect.height / 2 - ty);
    var ratio = ns / scale;
    tx = px - rect.width / 2 - ocx * ratio;
    ty = py - rect.height / 2 - ocy * ratio;
    scale = ns;
    apply();
  }

  function zoomBy(factor) {
    var rect = stage.getBoundingClientRect();
    setScale(scale * factor, rect.width / 2 + rect.left, rect.height / 2 + rect.top);
  }

  function fitToStage() {
    var rect = stage.getBoundingClientRect();
    if (!img.naturalWidth) return;
    var pad = 24;
    var s = Math.min((rect.width - pad) / img.naturalWidth, (rect.height - pad) / img.naturalHeight);
    scale = clampScale(s);
    tx = 0; ty = 0;
    apply();
    showHint('已适应窗口');
  }

  function actualSize() {
    scale = 1; tx = 0; ty = 0; apply(); showHint('实际大小 100%');
  }

  function resetView() {
    fitToStage();
  }

  // ---- 事件 ----
  document.getElementById('iv-zoom-in').addEventListener('click', function () { zoomBy(1.2); });
  document.getElementById('iv-zoom-out').addEventListener('click', function () { zoomBy(1 / 1.2); });
  document.getElementById('iv-actual').addEventListener('click', actualSize);
  document.getElementById('iv-fit').addEventListener('click', fitToStage);
  document.getElementById('iv-reset').addEventListener('click', resetView);
  document.getElementById('iv-close').addEventListener('click', function () {
    if (window.pywebview && window.pywebview.api && window.close) window.close();
    else window.open('', '_self').close();
  });

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    setScale(scale * factor, e.clientX, e.clientY);
  }, { passive: false });

  // 拖拽平移
  var dragging = false, lastX = 0, lastY = 0;
  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    stage.classList.add('grabbing');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  function endDrag() { dragging = false; stage.classList.remove('grabbing'); }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { document.getElementById('iv-close').click(); }
    else if (e.key === '+' || e.key === '=') { zoomBy(1.2); }
    else if (e.key === '-' || e.key === '_') { zoomBy(1 / 1.2); }
    else if (e.key === '0') { resetView(); }
  });

  img.addEventListener('load', function () {
    loading.style.display = 'none';
    fitToStage();
  });
  img.addEventListener('error', function () {
    loading.textContent = '图片加载失败：' + data.src.slice(0, 80);
  });

  function init() {
    if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.get_image) {
      loading.textContent = '（未连接到查看器 API）';
      return;
    }
    window.pywebview.api.get_image().then(function (d) {
      if (d && d.src) data = d;
      document.getElementById('iv-title').textContent = data.name || '图片';
      img.src = data.src;
      // 若已是缓存命中（complete）则直接 fit
      if (img.complete && img.naturalWidth) {
        loading.style.display = 'none'; fitToStage();
      }
    }).catch(function () {
      loading.textContent = '（获取图片数据失败）';
    });
  }

  window.addEventListener('pywebviewready', init);
  if (document.readyState !== 'loading') { if (!window.pywebview) init(); }
  else document.addEventListener('DOMContentLoaded', function () { if (!window.pywebview) init(); });
</script>
</body>
</html>
